name: Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to Server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST || '167.86.88.92' }}
        username: ${{ secrets.SSH_USERNAME || 'root' }}
        password: ${{ secrets.SSH_PASSWORD || 'propenta2025' }}
        port: 22
        envs: FREEMOPAY_APP_KEY,FREEMOPAY_SECRET_KEY
        script: |
          cd /root/system-sh/comsas-uy1.com
          git fetch origin main
          git reset --hard origin/main
          # Recréer le .env avec toutes les variables nécessaires
          cat > .env << 'ENVEOF'
          DB_NAME=comsas_db
          DB_USER=comsas_user
          DB_PASSWORD=comsas_password
          DB_HOST=db
          DB_PORT=5432
          DJANGO_SECRET_KEY=comsas_prod_secret_2026_juin
          DEBUG=False
          ALLOWED_HOSTS=comsas-uy1.com,www.comsas-uy1.com,167.86.88.92
          ENVEOF
          echo "FREEMOPAY_APP_KEY=${{ secrets.FREEMOPAY_APP_KEY }}" >> .env
          echo "FREEMOPAY_SECRET_KEY=${{ secrets.FREEMOPAY_SECRET_KEY }}" >> .env
          echo "--- .env injecté ---"
          cat .env | grep -v PASSWORD | grep -v SECRET
          docker-compose build --no-cache
          docker-compose up -d
          sleep 15
          docker-compose exec -T web python manage.py migrate --noinput
          docker-compose exec -T web python manage.py collectstatic --noinput
          docker-compose restart web
          echo "Déploiement forcé terminé avec succès"
