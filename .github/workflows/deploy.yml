name: Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to Server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST || '167.86.88.92' }}
        username: ${{ secrets.SSH_USERNAME || 'patrice' }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.SSH_PORT || 48127 }}
        timeout: 60s
        command_timeout: 30m
        envs: FREEMOPAY_APP_KEY,FREEMOPAY_SECRET_KEY
        script: |
          sudo bash << 'DEPLOY_SCRIPT_EOF'
          cd /root/system-sh/comsas-uy1.com
          git fetch origin main
          git reset --hard origin/main
          # Recréer le .env avec toutes les variables nécessaires
          cat > .env << 'ENVEOF'
          DB_NAME=comsas_db
          DB_USER=comsas_user
          DB_PASSWORD=comsas_password
          DB_HOST=db
          DB_PORT=5432
          DJANGO_SECRET_KEY=comsas_prod_secret_2026_juin
          DEBUG=False
          ALLOWED_HOSTS=comsas-uy1.com,www.comsas-uy1.com,167.86.88.92
          ENVEOF
          FPK="${{ secrets.FREEMOPAY_APP_KEY }}"
          FSK="${{ secrets.FREEMOPAY_SECRET_KEY }}"
          if [ -z "$FPK" ]; then FPK="a6f1c793-7193-4859-b6c9-323e4c6e76ca"; fi
          if [ -z "$FSK" ]; then FSK="4bT5nNhDWChrM9NwRZtHKj92qgK0qZWxoh-wI38kx64"; fi
          echo "PROPENTA_CLIENT_ID=$FPK" >> .env
          echo "PROPENTA_CLIENT_SECRET=$FSK" >> .env
          echo "PROPENTA_BASE_URL=https://app.pay.propentatech.com/api/v2" >> .env
          echo "PROPENTA_WEBHOOK_URL=https://www.comsas-uy1.com/webhook" >> .env
          echo "FREEMOPAY_APP_KEY=$FPK" >> .env
          echo "FREEMOPAY_SECRET_KEY=$FSK" >> .env
          echo "--- .env injecté ---"
          cat .env | grep -v PASSWORD | grep -v SECRET
          docker-compose build --no-cache
          docker-compose up -d
          sleep 15
          docker-compose exec -T web python manage.py migrate --noinput
          docker-compose exec -T web python manage.py collectstatic --noinput
          chown -R www-data:www-data media staticfiles 2>/dev/null || true
          chmod -R 755 media staticfiles
          chmod +x /root /root/system-sh 2>/dev/null || true
          docker-compose restart web
          echo "Déploiement forcé terminé avec succès"
          DEPLOY_SCRIPT_EOF
