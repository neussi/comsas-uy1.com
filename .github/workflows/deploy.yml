name: Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to Server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST || '167.86.88.92' }}
        username: ${{ secrets.SSH_USERNAME || 'patrice' }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.SSH_PORT || 48127 }}
        timeout: 60s
        command_timeout: 30m
        envs: PROPENTA_CLIENT_ID,PROPENTA_CLIENT_SECRET
        script: |
          sudo bash << 'DEPLOY_SCRIPT_EOF'
          cd /root/system-sh/comsas-uy1.com
          git fetch origin main
          git reset --hard origin/main
          # Recréer le .env avec toutes les variables nécessaires
          cat > .env << 'ENVEOF'
          DB_NAME=comsas_db
          DB_USER=comsas_user
          DB_PASSWORD=comsas_password
          DB_HOST=db
          DB_PORT=5432
          DJANGO_SECRET_KEY=comsas_prod_secret_2026_juin
          DEBUG=False
          ALLOWED_HOSTS=comsas-uy1.com,www.comsas-uy1.com,167.86.88.92
          PROPENTA_BASE_URL=https://app.pay.propentatech.com/api/v2
          PROPENTA_WEBHOOK_URL=https://www.comsas-uy1.com/webhook
          ENVEOF
          PROP_ID="${{ secrets.PROPENTA_CLIENT_ID || secrets.FREEMOPAY_APP_KEY }}"
          PROP_SEC="${{ secrets.PROPENTA_CLIENT_SECRET || secrets.FREEMOPAY_SECRET_KEY }}"
          if [ -n "$PROP_ID" ]; then
            echo "PROPENTA_CLIENT_ID=$PROP_ID" >> .env
            echo "FREEMOPAY_APP_KEY=$PROP_ID" >> .env
          fi
          if [ -n "$PROP_SEC" ]; then
            echo "PROPENTA_CLIENT_SECRET=$PROP_SEC" >> .env
            echo "FREEMOPAY_SECRET_KEY=$PROP_SEC" >> .env
          fi
          echo "--- .env injecté ---"
          cat .env | grep -v PASSWORD | grep -v SECRET
          mkdir -p staticfiles/images media/activities
          cp -r static/images/cofesti staticfiles/images/ 2>/dev/null || true
          cp -r static/images/cofesti/* media/activities/ 2>/dev/null || true
          docker-compose build --no-cache
          docker-compose up -d
          sleep 15
          docker-compose exec -T web python manage.py migrate --noinput
          docker-compose exec -T web python manage.py collectstatic --noinput --clear
          chown -R www-data:www-data media staticfiles 2>/dev/null || true
          chmod -R 755 media staticfiles
          chmod +x /root /root/system-sh 2>/dev/null || true
          docker-compose restart web
          echo "Déploiement forcé terminé avec succès"
          DEPLOY_SCRIPT_EOF
