version: '3.8'

services:
  db:
    image: postgres:13-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME:-comsas_db}
      - POSTGRES_USER=${DB_USER:-comsas_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-comsas_password}
    restart: always
    networks:
      - comsas_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: comsas_pgadmin
    restart: always
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: comsas@facsciences-uy1.cm
      PGADMIN_DEFAULT_PASSWORD: admin@comsas
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - comsas_network

  web:
    build: .
    container_name: comsas_web
    restart: always
    ports:
      - "35467:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - ./media:/app/media
    env_file:
      - .env
    environment:
      - DB_NAME=${DB_NAME:-comsas_db}
      - DB_USER=${DB_USER:-comsas_user}
      - DB_PASSWORD=${DB_PASSWORD:-comsas_password}
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db
    networks:
      - comsas_network

volumes:
  static_volume:
  postgres_data:
  pgadmin_data:


networks:
  comsas_network:
    driver: bridge
