<!-- MODAL UNIVERSELLE DE VOTE EN LIGNE (100 FCFA) -->
<style>
    #voteModal.hidden { display: none !important; }
    #voteModal:not(.hidden) { display: flex !important; }
</style>
<div id="voteModal" class="fixed inset-0 z-50 hidden overflow-y-auto bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4" style="background: rgba(15, 23, 42, 0.75);">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 sm:p-8 shadow-2xl border border-slate-100 relative">
        <button onclick="closeVoteModal()" type="button" class="absolute top-5 right-5 text-slate-400 hover:text-slate-600 w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center transition-colors">
            <i class="fas fa-times"></i>
        </button>

        <div class="text-center mb-6">
            <div class="w-14 h-14 rounded-2xl bg-amber-100 text-amber-600 flex items-center justify-center text-2xl mx-auto mb-3 font-bold">
                <i class="fas fa-vote-yea"></i>
            </div>
            <h3 class="text-xl font-bold text-slate-900 font-outfit" id="modalCandidateTitle">Voter pour le candidat</h3>
            <p class="text-xs text-slate-500 mt-1">Tarif officiel : <strong>{{ edition.vote_unit_price|floatformat:0 }} FCFA</strong> par voix</p>
        </div>

        <form id="cofestiVoteForm" onsubmit="handleVoteSubmit(event)" class="space-y-4">
            {% csrf_token %}
            <input type="hidden" name="candidate_id" id="modalCandidateId">

            <!-- Nombre de voix -->
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-2">Choisir le nombre de voix</label>
                <div class="grid grid-cols-4 gap-2 mb-2">
                    <button type="button" onclick="setVoteCount(1)" class="vote-qty-btn active py-2 rounded-xl text-xs font-bold border border-slate-200 bg-amber-500 text-white" data-qty="1">1 voix (100F)</button>
                    <button type="button" onclick="setVoteCount(5)" class="vote-qty-btn py-2 rounded-xl text-xs font-bold border border-slate-200 bg-slate-50 text-slate-700" data-qty="5">5 (500F)</button>
                    <button type="button" onclick="setVoteCount(10)" class="vote-qty-btn py-2 rounded-xl text-xs font-bold border border-slate-200 bg-slate-50 text-slate-700" data-qty="10">10 (1000F)</button>
                    <button type="button" onclick="setVoteCount(20)" class="vote-qty-btn py-2 rounded-xl text-xs font-bold border border-slate-200 bg-slate-50 text-slate-700" data-qty="20">20 (2000F)</button>
                </div>
                <input type="number" id="modalVoteCount" name="vote_count" value="1" min="1" max="1000" oninput="updateVoteTotal()" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm font-bold text-center focus:ring-2 focus:ring-amber-400">
            </div>

            <!-- Téléphone de paiement -->
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Numéro Mobile Money (OM / MoMo)</label>
                <input type="tel" name="phone" id="modalPhone" required placeholder="Ex: 659471152 ou 670000000" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-amber-400">
            </div>

            <!-- Nom du votant (facultatif) -->
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Votre Nom / Pseudo (Facultatif)</label>
                <input type="text" name="voter_name" id="modalVoterName" placeholder="Ex: Jean Dupont" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-amber-400">
            </div>

            <!-- Total à payer -->
            <div class="bg-amber-50 border border-amber-200 rounded-2xl p-4 flex items-center justify-between text-slate-800">
                <span class="text-xs font-bold uppercase">Total à régler :</span>
                <span class="text-lg font-black text-amber-600 font-outfit" id="modalVoteTotal">{{ edition.vote_unit_price|floatformat:0 }} FCFA</span>
            </div>

            <!-- Feedback / Statut -->
            <div id="voteStatusBox" class="hidden p-3 rounded-xl text-xs font-medium"></div>

            <button type="submit" id="voteSubmitBtn" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-300 hover:to-amber-400 text-slate-950 font-bold text-sm transition-all shadow-lg shadow-amber-500/20 flex items-center justify-center gap-2">
                <i class="fas fa-lock"></i>
                <span>Valider le vote sécurisé</span>
            </button>
        </form>
    </div>
</div>

<script>
    const unitPrice = {{ edition.vote_unit_price|default:100 }};

    function openVoteModal(candidateId, candidateName, number, contestType) {
        document.getElementById('modalCandidateId').value = candidateId;
        document.getElementById('modalCandidateTitle').textContent = `Voter pour #${number} ${candidateName} (${contestType})`;
        setVoteCount(1);
        document.getElementById('voteStatusBox').classList.add('hidden');
        document.getElementById('voteSubmitBtn').disabled = false;
        document.getElementById('voteModal').classList.remove('hidden');
    }

    function closeVoteModal() {
        document.getElementById('voteModal').classList.add('hidden');
    }

    function setVoteCount(qty) {
        document.getElementById('modalVoteCount').value = qty;
        document.querySelectorAll('.vote-qty-btn').forEach(btn => {
            if (parseInt(btn.getAttribute('data-qty')) === qty) {
                btn.classList.add('bg-amber-500', 'text-white');
                btn.classList.remove('bg-slate-50', 'text-slate-700');
            } else {
                btn.classList.remove('bg-amber-500', 'text-white');
                btn.classList.add('bg-slate-50', 'text-slate-700');
            }
        });
        updateVoteTotal();
    }

    function updateVoteTotal() {
        const count = parseInt(document.getElementById('modalVoteCount').value) || 1;
        const total = count * unitPrice;
        document.getElementById('modalVoteTotal').textContent = `${total.toLocaleString()} FCFA`;
    }

    async function handleVoteSubmit(e) {
        e.preventDefault();
        const form = document.getElementById('cofestiVoteForm');
        const submitBtn = document.getElementById('voteSubmitBtn');
        const statusBox = document.getElementById('voteStatusBox');

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Connexion Mobile Money...';
        statusBox.className = 'p-3 rounded-xl text-xs font-medium bg-blue-50 text-blue-700 border border-blue-200 block';
        statusBox.textContent = "Initiation du paiement via Freemopay en cours...";

        const formData = new FormData(form);

        try {
            const resp = await fetch("{% url 'cofesti_vote_initiate' %}", {
                method: 'POST',
                body: formData
            });
            const data = await resp.json();

            if (data.success) {
                statusBox.className = 'p-3 rounded-xl text-xs font-medium bg-amber-50 text-amber-800 border border-amber-200 block';
                statusBox.innerHTML = `<strong>Paiement en attente :</strong> ${data.message} <br>Vérification automatique en cours...`;

                // Polling
                pollVoteStatus(data.transaction_id);
            } else {
                statusBox.className = 'p-3 rounded-xl text-xs font-medium bg-rose-50 text-rose-700 border border-rose-200 block';
                statusBox.textContent = data.error || "Erreur lors de l'initiation du paiement.";
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-lock"></i> Réessayer';
            }
        } catch (err) {
            statusBox.className = 'p-3 rounded-xl text-xs font-medium bg-rose-50 text-rose-700 border border-rose-200 block';
            statusBox.textContent = "Erreur réseau. Veuillez vérifier votre connexion.";
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-lock"></i> Réessayer';
        }
    }

    function pollVoteStatus(txId) {
        let attempts = 0;
        const interval = setInterval(async () => {
            attempts++;
            if (attempts > 30) {
                clearInterval(interval);
                const statusBox = document.getElementById('voteStatusBox');
                statusBox.className = 'p-3 rounded-xl text-xs font-medium bg-amber-50 text-amber-800 border border-amber-200 block';
                statusBox.textContent = "Délai d'attente dépassé. Si vous avez composé votre code PIN, vos votes seront comptabilisés dans un instant.";
                return;
            }

            try {
                const resp = await fetch(`/api/cofesti/vote/status/${txId}/`);
                const data = await resp.json();

                if (data.is_confirmed) {
                    clearInterval(interval);
                    window.location.href = `/cofesti/vote/merci/${txId}/`;
                } else if (data.status === 'failed') {
                    clearInterval(interval);
                    const statusBox = document.getElementById('voteStatusBox');
                    statusBox.className = 'p-3 rounded-xl text-xs font-medium bg-rose-50 text-rose-700 border border-rose-200 block';
                    statusBox.textContent = "Le paiement a échoué ou a été refusé.";
                    document.getElementById('voteSubmitBtn').disabled = false;
                    document.getElementById('voteSubmitBtn').innerHTML = '<i class="fas fa-lock"></i> Réessayer';
                }
            } catch (e) {}
        }, 3000);
    }
</script>
