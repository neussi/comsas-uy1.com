{% extends 'base.html' %}
{% load static %}

{% block title %}{{ candidate.name }} — MISS & MISTER J.U.IN 2026{% endblock %}

{% block extra_css %}
<style>
    :root {
        --rose: #E91E63;
        --rose-light: #f06292;
        --rose-dark: #c2185b;
        --rose-pale: rgba(233, 30, 99, .08);
        --rose-border: rgba(233, 30, 99, .2);
        --rose-shadow: rgba(233, 30, 99, .15);
        --blanc: #ffffff;
        --text-dark: #1a0a10;
        --text-muted: #8a6070;
        --royal-gold: #D4AF37;
        --gradient: linear-gradient(135deg, #E91E63 0%, #f06292 100%);
    }

    body {
        background-color: #050204;
        color: #fff;
        background-image: 
            radial-gradient(circle at 15% 50%, rgba(233, 30, 99, 0.08), transparent 25%),
            radial-gradient(circle at 85% 30%, rgba(212, 175, 55, 0.08), transparent 25%);
        background-attachment: fixed;
    }

    .candidate-hero {
        padding: 140px 0 80px;
        position: relative;
        overflow: hidden;
    }

    /* Royal ornaments */
    .royal-decor {
        position: absolute;
        width: 600px;
        height: 600px;
        border: 2px solid rgba(212, 175, 55, 0.05);
        border-radius: 50%;
        top: -150px;
        right: -200px;
        animation: rotate-slow 40s linear infinite;
        z-index: 0;
    }

    .royal-decor::before {
        content: '';
        position: absolute;
        inset: 40px;
        border: 1px dashed rgba(233, 30, 99, 0.1);
        border-radius: 50%;
        animation: rotate-slow 20s linear infinite reverse;
    }

    @keyframes rotate-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .profile-container {
        background: rgba(20, 10, 15, 0.6);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border-radius: 32px;
        box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(212, 175, 55, 0.15);
        overflow: hidden;
        display: flex;
        flex-wrap: wrap;
        position: relative;
        z-index: 2;
    }

    .profile-image-side {
        flex: 1;
        min-width: 350px;
        position: relative;
    }

    .profile-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        min-height: 100%;
        mask-image: linear-gradient(to right, black 80%, transparent 100%);
        -webkit-mask-image: linear-gradient(to right, black 80%, transparent 100%);
    }

    .profile-info-side {
        flex: 1.2;
        min-width: 400px;
        padding: 60px 50px;
        display: flex;
        flex-direction: column;
    }

    .candidate-type-label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: linear-gradient(90deg, rgba(212, 175, 55, 0.1), transparent);
        color: var(--royal-gold);
        text-transform: uppercase;
        font-weight: 800;
        letter-spacing: 4px;
        font-size: 0.85rem;
        padding: 8px 16px;
        border-radius: 100px;
        margin-bottom: 20px;
        width: fit-content;
        border: 1px solid rgba(212, 175, 55, 0.2);
    }

    .candidate-fullname {
        font-family: 'Playfair Display', 'Cormorant Garamond', serif;
        font-weight: 800;
        font-size: clamp(3rem, 5vw, 4.5rem);
        line-height: 1.1;
        margin-bottom: 24px;
        background: linear-gradient(135deg, #ffffff 0%, #ffd1e0 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 10px 30px rgba(233, 30, 99, 0.2);
    }

    .meta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 35px;
    }

    .meta-item {
        display: inline-flex;
        align-items: center;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        color: #e2e8f0;
        padding: 10px 20px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 0.9rem;
        transition: all 0.3s;
    }

    .meta-item i {
        color: var(--rose);
    }

    .meta-item:hover {
        background: rgba(233, 30, 99, 0.1);
        border-color: rgba(233, 30, 99, 0.3);
        transform: translateY(-2px);
    }

    .bio-title {
        font-family: 'Playfair Display', serif;
        font-size: 1.5rem;
        color: var(--royal-gold);
        margin-bottom: 15px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .bio-text {
        font-size: 1.05rem;
        line-height: 1.8;
        color: #cbd5e1;
        background: rgba(0, 0, 0, 0.2);
        padding: 25px;
        border-radius: 20px;
        border-left: 3px solid var(--rose);
        margin-bottom: 40px;
    }

    .stats-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-bottom: 40px;
    }

    .stat-box {
        text-align: center;
        padding: 25px 15px;
        background: linear-gradient(135deg, rgba(233, 30, 99, 0.05) 0%, rgba(20, 10, 15, 0.5) 100%);
        border-radius: 24px;
        border: 1px solid rgba(233, 30, 99, 0.15);
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        position: relative;
        overflow: hidden;
    }

    .stat-box::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; height: 2px;
        background: linear-gradient(90deg, transparent, var(--rose), transparent);
        opacity: 0;
        transition: opacity 0.3s;
    }

    .stat-box:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 30px rgba(233, 30, 99, 0.15);
        border-color: rgba(233, 30, 99, 0.4);
    }

    .stat-box:hover::before { opacity: 1; }

    .stat-val {
        font-size: 2.2rem;
        font-weight: 900;
        background: var(--gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        display: block;
        line-height: 1;
        margin-bottom: 8px;
        font-family: 'Playfair Display', serif;
    }

    .stat-lab {
        font-size: 0.75rem;
        text-transform: uppercase;
        font-weight: 700;
        color: #94a3b8;
        letter-spacing: 1px;
    }

    /* Vote Form */
    .vote-section-wrapper {
        margin-top: 60px;
        position: relative;
    }

    .vote-card {
        background: rgba(20, 10, 15, 0.7);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        color: white;
        padding: 60px 50px;
        border-radius: 40px;
        box-shadow: 0 40px 100px rgba(0,0,0,0.6);
        border: 1px solid rgba(233, 30, 99, 0.25);
        position: relative;
        overflow: hidden;
    }

    .vote-card::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle at center, rgba(233, 30, 99, 0.05) 0%, transparent 60%);
        pointer-events: none;
    }

    .form-control-custom {
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: white;
        padding: 16px 24px;
        border-radius: 16px;
        margin-bottom: 20px;
        font-size: 1rem;
        transition: all 0.3s;
    }

    .form-control-custom:focus {
        background: rgba(0, 0, 0, 0.5);
        border-color: var(--rose);
        color: white;
        box-shadow: 0 0 0 4px rgba(233, 30, 99, 0.15);
    }

    .vote-btn {
        background: linear-gradient(135deg, var(--rose) 0%, var(--rose-dark) 100%);
        border: none;
        color: white;
        padding: 20px;
        border-radius: 16px;
        font-weight: 800;
        font-size: 1.15rem;
        width: 100%;
        margin-top: 15px;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        text-transform: uppercase;
        letter-spacing: 2px;
        box-shadow: 0 10px 30px rgba(233, 30, 99, 0.3);
    }

    .vote-btn:hover {
        transform: translateY(-3px) scale(1.02);
        box-shadow: 0 20px 40px rgba(233, 30, 99, 0.5);
    }

    /* Video Section */
    .video-container {
        margin-top: 40px;
        border-radius: 24px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.1);
        position: relative;
        padding-bottom: 56.25%; /* 16:9 aspect ratio */
        height: 0;
    }

    .video-container iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: 0;
    }

    @media (max-width: 991px) {
        .profile-img {
            mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
            height: 500px;
        }
        .profile-info-side {
            padding: 40px 30px;
        }
    }
{% endblock %}

{% block content %}
<section class="candidate-hero">
    <div class="royal-decor"></div>
    <div class="container">
        <nav aria-label="breadcrumb" class="mb-5">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{% url 'juin_miss_mister' %}">Concours</a></li>
                <li class="breadcrumb-item active">{{ candidate.name }}</li>
            </ol>
        </nav>

        <div class="profile-container" data-aos="fade-up">
            <div class="profile-image-side">
                {% if candidate.image %}
                <img src="{{ candidate.image.url }}" alt="{{ candidate.name }}" class="profile-img">
                {% else %}
                <img src="https://via.placeholder.com/800x1000" alt="{{ candidate.name }}" class="profile-img">
                {% endif %}
            </div>
            <div class="profile-info-side">
                <div class="candidate-type-label">
                    <i class="fas fa-crown"></i> {{ candidate.get_candidate_type_display }} J.U.IN 2026
                </div>
                <h1 class="candidate-fullname">{{ candidate.name }}</h1>
                
                <div class="meta-row">
                    <span class="meta-item"><i class="fas fa-university me-2"></i> {{ candidate.school }}</span>
                    {% if candidate.age %}<span class="meta-item"><i class="fas fa-birthday-cake me-2"></i> {{ candidate.age }} ans</span>{% endif %}
                    {% if candidate.level %}<span class="meta-item"><i class="fas fa-graduation-cap me-2"></i> {{ candidate.level }}</span>{% endif %}
                </div>

                <div class="bio-text">
                    <div class="bio-title"><i class="fas fa-quote-left me-2"></i> Biographie</div>
                    {{ candidate.description|linebreaks }}
                </div>

                <div class="stats-grid">
                    <div class="stat-box">
                        <span class="stat-val">{{ candidate.votes_count }}</span>
                        <span class="stat-lab">Votes Validés</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-val">#{{ rank }}</span>
                        <span class="stat-lab">Classement Actuel</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-val">{{ percentage }}%</span>
                        <span class="stat-lab">Part de voix</span>
                    </div>
                </div>

                <!-- Video Section -->
                {% if candidate.video_url %}
                <h5 class="fw-bold mb-3 mt-4" style="font-family: 'Playfair Display', serif; color: var(--royal-gold);"><i class="fas fa-play-circle me-2"></i> Vidéo de présentation</h5>
                <div class="video-container">
                    {% if 'youtube.com' in candidate.video_url or 'youtu.be' in candidate.video_url %}
                        <!-- Auto-convert youtube links to embed -->
                        <iframe src="{{ candidate.video_url|replace:'watch?v=,embed/'|replace:'youtu.be/,youtube.com/embed/' }}" allowfullscreen></iframe>
                    {% else %}
                        <iframe src="{{ candidate.video_url }}" allowfullscreen></iframe>
                    {% endif %}
                </div>
                {% endif %}

                <!-- Gallery Section -->
                {% if candidate.image2 or candidate.image3 or candidate.image4 %}
                <h5 class="fw-bold mb-3 mt-5" style="font-family: 'Playfair Display', serif; color: var(--royal-gold);"><i class="fas fa-images me-2"></i> Galerie Photos</h5>
                <div class="gallery-grid">
                    {% if candidate.image2 %}
                    <a href="{{ candidate.image2.url }}" class="glightbox" data-gallery="candidate-gallery">
                        <div class="gallery-item-wrap">
                            <img src="{{ candidate.image2.url }}" alt="Gallery image 2" class="gallery-thumb">
                            <div class="gallery-overlay"><i class="fas fa-expand"></i></div>
                        </div>
                    </a>
                    {% endif %}
                    {% if candidate.image3 %}
                    <a href="{{ candidate.image3.url }}" class="glightbox" data-gallery="candidate-gallery">
                        <div class="gallery-item-wrap">
                            <img src="{{ candidate.image3.url }}" alt="Gallery image 3" class="gallery-thumb">
                            <div class="gallery-overlay"><i class="fas fa-expand"></i></div>
                        </div>
                    </a>
                    {% endif %}
                    {% if candidate.image4 %}
                    <a href="{{ candidate.image4.url }}" class="glightbox" data-gallery="candidate-gallery">
                        <div class="gallery-item-wrap">
                            <img src="{{ candidate.image4.url }}" alt="Gallery image 4" class="gallery-thumb">
                            <div class="gallery-overlay"><i class="fas fa-expand"></i></div>
                        </div>
                    </a>
                    {% endif %}
                </div>
                {% endif %}
            </div>
        </div>

        <div class="row mt-5" id="vote">
            <div class="col-lg-7 mx-auto">
                <div class="vote-card" data-aos="zoom-in">
                    <div id="voteContent">
                        <h3 class="text-center fw-bold mb-2">Voter pour {{ candidate.name }}</h3>
                        <p class="text-center text-white-50 mb-4">Soutenez ce candidat via Mobile Money (100 FCFA / vote)</p>
                        
                        <form id="voteForm">
                            {% csrf_token %}
                            <input type="hidden" name="candidate_id" value="{{ candidate.id }}">
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="small text-white-50 mb-2">Votre Nom (Optionnel)</label>
                                    <input type="text" name="voter_name" class="form-control form-control-custom" placeholder="Ex: Jean Dupont">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="small text-white-50 mb-2">Votre Établissement</label>
                                    <input type="text" name="voter_school" class="form-control form-control-custom" placeholder="Ex: UY1, Polytechnique...">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="small text-white-50 mb-2">Nombre de votes</label>
                                    <input type="number" name="vote_count" id="vote_count" class="form-control form-control-custom" value="1" min="1" step="1">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="small text-white-50 mb-2">Montant total (FCFA)</label>
                                    <input type="text" id="total_amount" class="form-control form-control-custom" value="100" readonly>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-12 mb-3">
                                    <label class="small text-white-50 mb-2">Votre numéro Mobile Money (MTN/Orange)</label>
                                    <input type="text" name="phone" class="form-control form-control-custom" placeholder="Ex: 6XXXXXXXX" required>
                                </div>
                            </div>

                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" name="is_anonymous" id="is_anonymous">
                                <label class="form-check-label small text-white-50" for="is_anonymous">
                                    Voter anonymement
                                </label>
                            </div>

                            <button type="submit" class="vote-btn" id="submitBtn">
                                <i class="fas fa-paper-plane me-2"></i> CONFIRMER LE VOTE
                            </button>
                        </form>
                    </div>

                    <!-- Loading State -->
                    <div id="loadingState" class="text-center py-5 d-none">
                        <div class="payment-loader mb-4">
                            <div class="spinner-border text-rose" role="status" style="width: 3rem; height: 3rem;"></div>
                        </div>
                        <h4 class="fw-bold mb-2">Traitement en cours...</h4>
                        <p class="text-white-50">Veuillez valider la transaction sur votre téléphone via le prompt qui va apparaître.</p>
                        <div class="mt-4">
                            <small class="text-muted">En attente de la réponse de l'opérateur...</small>
                        </div>
                    </div>

                    <!-- Success State -->
                    <div id="successState" class="text-center py-5 d-none">
                        <div class="success-icon-wrap mb-4">
                            <i class="fas fa-check-circle fa-5x text-success"></i>
                        </div>
                        <h2 class="fw-bold mb-3">Merci pour votre vote !</h2>
                        <p class="lead mb-4">Votre soutien a été enregistré avec succès pour {{ candidate.name }}.</p>
                        
                        <div class="share-box p-4 bg-white bg-opacity-10 rounded-4 mb-4">
                            <p class="small text-white-50 mb-3">Partagez pour augmenter ses chances :</p>
                            <div class="d-flex justify-content-center gap-3">
                                <a href="https://wa.me/?text=Je viens de voter pour {{ candidate.name }} au concours Miss %26 Mister J.U.IN 2026 ! Soutenez-le ici : {{ request.build_absolute_uri }}" target="_blank" class="btn btn-success rounded-circle"><i class="fab fa-whatsapp"></i></a>
                                <a href="https://www.facebook.com/sharer/sharer.php?u={{ request.build_absolute_uri }}" target="_blank" class="btn btn-primary rounded-circle"><i class="fab fa-facebook-f"></i></a>
                            </div>
                        </div>

                        <button class="btn btn-outline-light rounded-pill px-4" onclick="window.location.reload()">Voter à nouveau</button>
                    </div>
                    
                    <!-- Error State -->
                    <div id="errorState" class="text-center py-5 d-none">
                        <i class="fas fa-exclamation-triangle fa-4x text-danger mb-3"></i>
                        <h4 class="fw-bold">Échec du paiement</h4>
                        <p id="errorMessage" class="text-white-50"></p>
                        <button class="btn btn-juin mt-3" onclick="resetForm()">Réessayer</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Additional CSS for the enhanced UI -->
<style>
    .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 15px;
    }
    .gallery-item-wrap {
        position: relative;
        border-radius: 15px;
        overflow: hidden;
        aspect-ratio: 1;
        cursor: pointer;
    }
    .gallery-thumb {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.5s;
    }
    .gallery-overlay {
        position: absolute;
        inset: 0;
        background: rgba(233, 30, 99, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 1.5rem;
        opacity: 0;
        transition: opacity 0.3s;
    }
    .gallery-item-wrap:hover .gallery-thumb { transform: scale(1.1); }
    .gallery-item-wrap:hover .gallery-overlay { opacity: 1; }

    .vote-card {
        background: transparent;
        color: white;
        padding: 0;
        border-radius: 0;
        box-shadow: none;
        border: none;
    }
</style>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
    function resetForm() {
        document.getElementById('voteContent').classList.remove('d-none');
        document.getElementById('loadingState').classList.add('d-none');
        document.getElementById('errorState').classList.add('d-none');
        document.getElementById('successState').classList.add('d-none');
    }

    const voteInput = document.getElementById('vote_count');
    const amountInput = document.getElementById('total_amount');
    
    voteInput.addEventListener('input', function() {
        amountInput.value = (this.value * 100) + ' FCFA';
    });

    document.getElementById('voteForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const formData = new FormData(this);
        const voteContent = document.getElementById('voteContent');
        const loading = document.getElementById('loadingState');
        const errorDiv = document.getElementById('errorState');
        const errorMsg = document.getElementById('errorMessage');
        
        voteContent.classList.add('d-none');
        loading.classList.remove('d-none');
        
        fetch('{% url "juin_vote_initiate" %}', {
            method: 'POST',
            body: formData,
            headers: {
                'X-CSRFToken': '{{ csrf_token }}'
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                pollStatus(data.transaction_id);
            } else {
                loading.classList.add('d-none');
                errorDiv.classList.remove('d-none');
                errorMsg.textContent = data.error || 'Erreur inconnue';
            }
        })
        .catch(err => {
            loading.classList.add('d-none');
            errorDiv.classList.remove('d-none');
            errorMsg.textContent = 'Une erreur réseau est survenue.';
        });
    });

    function pollStatus(txId) {
        const interval = setInterval(() => {
            fetch(`/api/juin/vote/status/${txId}/`)
            .then(res => res.json())
            .then(data => {
                if (data.status === 'completed') {
                    clearInterval(interval);
                    showSuccess();
                } else if (data.status === 'failed') {
                    clearInterval(interval);
                    document.getElementById('loadingState').classList.add('d-none');
                    document.getElementById('errorState').classList.remove('d-none');
                    document.getElementById('errorMessage').textContent = 'Le paiement a échoué.';
                }
            });
        }, 3000);
    }

    function showSuccess() {
        document.getElementById('loadingState').classList.add('d-none');
        document.getElementById('successState').classList.remove('d-none');
        
        // Confetti!
        confetti({
            particleCount: 150,
            spread: 70,
            origin: { y: 0.6 },
            colors: ['#E91E63', '#ffffff', '#FFD700']
        });
    }

    // Initialize GLightbox
    document.addEventListener('DOMContentLoaded', function() {
        const lightbox = GLightbox({
            selector: '.glightbox'
        });
    });
</script>
{% endblock %}
