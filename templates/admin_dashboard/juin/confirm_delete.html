{% extends 'admin_dashboard/base.html' %}

{% block title %}Confirmer la suppression — J.U.IN 2026{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm mt-5">
                <div class="card-body p-5 text-center">
                    <div class="text-danger mb-4" style="font-size: 3rem;">
                        <i class="fas fa-exclamation-triangle"></i>
                    </div>
                    <h2 class="fw-bold h4 mb-3">Confirmation de suppression</h2>
                    <p class="text-muted mb-4">
                        Êtes-vous sûr de vouloir supprimer <strong>"{{ object }}"</strong> ?<br>
                        Cette action est irréversible.
                    </p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-danger btn-lg">Oui, supprimer définitivement</button>
                            <a href="{% url cancel_url %}" class="btn btn-outline-secondary">Annuler et revenir</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
