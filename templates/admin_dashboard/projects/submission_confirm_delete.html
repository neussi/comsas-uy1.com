{% extends 'admin_dashboard/base.html' %}

{% block title %}Supprimer la soumission{% endblock %}

{% block content %}
<div class="container-fluid py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow text-center p-4">
                <div class="mb-3"><i class="fas fa-exclamation-triangle fa-3x text-danger"></i></div>
                <h4 class="fw-bold mb-2">Confirmer la suppression</h4>
                <p class="text-muted">Êtes-vous sûr de vouloir supprimer la soumission de <strong>{{ object.project_name
                        }}</strong> ? Cette action est irréversible.</p>
                <div class="d-flex gap-2 justify-content-center mt-3">
                    <form method="post">{% csrf_token %}
                        <button class="btn btn-danger"><i class="fas fa-trash me-2"></i>Oui, supprimer</button>
                    </form>
                    <a href="{% url 'admin_project_submission_detail' object.pk %}"
                        class="btn btn-outline-secondary">Annuler</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
